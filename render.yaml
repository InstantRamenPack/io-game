services:
  - type: web
    name: io-game-server
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bun run build:client
    startCommand: bun run prod:server
    healthCheckPath: /healthz
    envVars:
      - key: BUN_VERSION
        value: 1.3.8
    buildFilter:
      paths:
        - apps/server/**
        - apps/client/**
        - packages/**
        - package.json
        - bun.lock
        - tsconfig.json
        - render.yaml
