services:
  - type: web
    name: io-game
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run prod:server
    healthCheckPath: /healthz
    envVars:
      - key: BUN_VERSION
        value: 1.3.8
      - key: NODE_ENV
        value: production
      - key: TICK_RATE
        value: "20"
      - key: SIMULATION_SPEED_MULTIPLIER
        value: "1"
    buildFilter:
      paths:
        - apps/server/**
        - apps/client/**
        - packages/**
        - package.json
        - bun.lock
        - tsconfig.json
        - render.yaml
