services:
  - type: web
    name: io-game-server
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile
    startCommand: bun run dev:server
    healthCheckPath: /
    envVars:
      - key: BUN_VERSION
        value: 1.3.8
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - package.json
        - bun.lock
        - tsconfig.json
        - render.yaml
