<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>io-game client</title>
  </head>
  <body>
    <div id="game-root" class="menu-backdrop-world"></div>
    <main class="menu-scene" data-screen="menu">
      <section class="play-card" aria-label="Lobby join modal">
        <h1>Lobby</h1>
        <label class="name-label" for="player-name-input">Name</label>
        <input
          id="player-name-input"
          class="field"
          type="text"
          aria-label="Player name"
          autocomplete="nickname"
          required
        />
        <div id="player-name-error" class="field-error" hidden></div>
        <button class="launch" id="launch-btn" type="button">Play</button>
      </section>
    </main>
    <div id="training-ground-banner" class="training-ground-banner" hidden>
      <span class="training-ground-label">Training Ground</span>
      <span class="training-ground-sub"
        >Friendly fire on &middot; No waves &middot; Practice freely</span
      >
    </div>
    <div id="game-start-prompt" class="game-start-prompt" hidden>
      Game started
    </div>
    <div id="match-core-hud" class="match-core-hud" hidden></div>
    <section id="lobby-hud-root" class="lobby-hud" hidden>
      <div id="lobby-hud-status" class="lobby-hud-status">
        No lobby queue selected
      </div>
      <div id="lobby-hud-meta" class="lobby-hud-meta"></div>
      <div class="lobby-hud-actions">
        <button id="lobby-join-btn" type="button">Start Lobby</button>
        <button id="lobby-start-btn" type="button">Start Lobby</button>
        <input
          id="lobby-code-input"
          type="text"
          maxlength="12"
          placeholder="Lobby code"
          aria-label="Lobby code"
        />
        <button id="lobby-code-join-btn" type="button">Join Code</button>
        <button id="lobby-leave-btn" type="button">Leave Lobby</button>
      </div>
    </section>
    <div id="chat-root" class="chat-shell" hidden>
      <div id="chat-lines" class="chat-lines" aria-live="polite"></div>
      <div id="chat-suggestions" class="chat-suggestions" hidden></div>
      <div class="chat-input-row">
        <span class="chat-prompt">&gt;</span>
        <input
          id="chat-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Type a message..."
          maxlength="240"
          aria-label="Chat input"
        />
      </div>
    </div>
    <div id="death-overlay" class="death-overlay" hidden>
      <div class="death-card">
        <p class="death-kicker">You Died</p>
        <h2>Down</h2>
        <p>Respawn when you’re ready.</p>
        <button id="respawn-btn" type="button">Respawn</button>
      </div>
    </div>
    <div id="spectate-hud" class="spectate-hud" hidden>
      <span class="spectate-label">SPECTATING</span>
      <strong id="spectate-hud-name" class="spectate-name">Player</strong>
      <span class="spectate-hint">Respawns at dawn</span>
    </div>
    <div id="game-over-overlay" class="game-over-overlay" hidden>
      <div class="game-over-card">
        <p id="game-over-kicker" class="game-over-kicker">
          Extraction Complete
        </p>
        <h2 id="game-over-title" class="game-over-title">YOUR TEAM ESCAPED</h2>
        <div id="game-over-stats" class="game-over-stats">
          <div class="game-over-stat-row">
            <span class="stat-label">GAME DURATION</span>
            <span id="game-over-duration" class="stat-value">--:--</span>
          </div>
          <div class="game-over-stat-row">
            <span class="stat-label">WAVES SURVIVED</span>
            <span id="game-over-waves" class="stat-value">--</span>
          </div>
        </div>
        <div class="game-over-actions">
          <button
            id="game-over-play-again-btn"
            type="button"
            class="game-over-btn game-over-btn--secondary"
            hidden
          >
            Play Again
          </button>
          <button id="game-over-return-btn" type="button" class="game-over-btn">
            Return to Lobby
          </button>
          <button
            id="game-over-home-btn"
            type="button"
            class="game-over-btn game-over-btn--secondary"
          >
            Home / Settings
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
