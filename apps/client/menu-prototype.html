<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombs Menu Prototype</title>
    <style>
      :root {
        --bg-0: #0d160f;
        --bg-1: #112116;
        --bg-2: #1d3623;
        --panel: rgba(7, 14, 9, 0.78);
        --panel-strong: rgba(5, 10, 7, 0.9);
        --line: rgba(175, 255, 144, 0.16);
        --text-main: #e8f5e7;
        --text-dim: #98ad96;
        --accent: #5cca2a;
        --accent-strong: #82ec4f;
        --hazard: #bf382f;
        --hazard-soft: rgba(191, 56, 47, 0.24);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--text-main);
        background: radial-gradient(
          circle at 18% 20%,
          #1d311f 0%,
          #0d140f 58%,
          #070a08 100%
        );
      }

      .menu-scene {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .menu-scene::before {
        content: "";
        position: absolute;
        inset: -20%;
        background:
          linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
          linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px
            48px;
        transform: perspective(900px) rotateX(64deg) translateY(24vh);
        transform-origin: center;
        opacity: 0.45;
        animation: drift 8s linear infinite;
      }

      .menu-scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.1) 0%,
            rgba(0, 0, 0, 0.7) 100%
          ),
          linear-gradient(
            92deg,
            rgba(130, 236, 79, 0.03) 0%,
            rgba(191, 56, 47, 0.22) 85%
          );
        pointer-events: none;
      }

      .hud-top {
        position: absolute;
        top: 18px;
        left: 24px;
        right: 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 3;
      }

      .brand {
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(38px, 6vw, 82px);
        line-height: 0.88;
      }

      .brand p {
        margin: 8px 0 0;
        color: var(--text-dim);
        font-size: clamp(13px, 1.8vw, 20px);
      }

      .status {
        font-size: 13px;
        color: var(--text-dim);
        text-align: right;
        max-width: 240px;
      }

      .layout {
        width: min(1080px, 100%);
        display: grid;
        gap: 14px;
        grid-template-columns: 230px 1fr;
        align-items: end;
        position: relative;
        z-index: 3;
        margin-top: 90px;
      }

      .side-menu {
        background: linear-gradient(
          180deg,
          rgba(13, 30, 16, 0.68),
          rgba(7, 15, 9, 0.7)
        );
        border: 1px solid rgba(157, 236, 123, 0.18);
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }

      .side-menu button {
        width: 100%;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        background: transparent;
        color: var(--text-main);
        text-align: left;
        padding: 15px 18px;
        font-size: 27px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 180ms ease,
          color 180ms ease;
      }

      .side-menu button:hover,
      .side-menu button[aria-current="true"] {
        background: linear-gradient(
          90deg,
          rgba(118, 230, 61, 0.23),
          transparent
        );
        color: #f4ffe9;
      }

      .play-card {
        background: linear-gradient(180deg, var(--panel), var(--panel-strong));
        border: 1px solid rgba(168, 248, 135, 0.2);
        box-shadow: var(--shadow);
        border-radius: 14px;
        padding: 28px;
      }

      .card-top {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
      }

      .card-top h2 {
        margin: 0;
        font-size: clamp(24px, 3.2vw, 44px);
        letter-spacing: 0.04em;
      }

      .danger-pill {
        border: 1px solid rgba(255, 92, 84, 0.45);
        background: var(--hazard-soft);
        color: #ffd4d0;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 10px;
      }

      .metrics {
        display: flex;
        gap: 18px;
        color: var(--text-dim);
        font-size: 13px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .account-gate {
        margin-bottom: 18px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid rgba(255, 140, 140, 0.22);
        background: rgba(191, 56, 47, 0.15);
        color: #ffd7d3;
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 8px;
      }

      .account-gate.ok {
        border-color: rgba(157, 236, 123, 0.24);
        background: rgba(72, 170, 35, 0.16);
        color: #d8f7ca;
      }

      .account-btn {
        border: 0;
        border-radius: 8px;
        background: #78db49;
        color: #0d1709;
        font-weight: 700;
        font-size: 13px;
        padding: 8px 12px;
        cursor: pointer;
      }

      .play-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .field,
      .server,
      .launch {
        width: 100%;
        border: 0;
        border-radius: 10px;
        height: 60px;
        font-size: 29px;
        padding: 0 18px;
      }

      .field,
      .server {
        background: rgba(233, 247, 223, 0.93);
        color: #081006;
      }

      .launch {
        background: linear-gradient(180deg, var(--accent), #3da40f);
        color: #f4ffe9;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 160ms ease,
          filter 160ms ease;
      }

      .launch:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      .footer-row {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-dim);
      }

      .bottom-stats {
        position: absolute;
        left: 24px;
        bottom: 18px;
        z-index: 3;
        border: 1px solid rgba(157, 236, 123, 0.2);
        background: rgba(4, 10, 6, 0.7);
        backdrop-filter: blur(4px);
        padding: 12px 14px;
        display: flex;
        gap: 18px;
      }

      .bottom-stats .hp {
        color: var(--accent-strong);
        font-size: 30px;
        line-height: 1;
      }

      .bottom-stats .meta {
        font-size: 12px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }

      @keyframes drift {
        from {
          transform: perspective(900px) rotateX(64deg) translateY(22vh)
            translateX(-10px);
        }
        to {
          transform: perspective(900px) rotateX(64deg) translateY(22vh)
            translateX(38px);
        }
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
          margin-top: 120px;
        }

        .side-menu {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .side-menu button {
          font-size: 20px;
          border-right: 1px solid rgba(255, 255, 255, 0.07);
        }

        .bottom-stats {
          right: 24px;
          left: auto;
        }
      }

      @media (max-width: 640px) {
        .menu-scene {
          padding: 16px;
        }

        .hud-top {
          left: 16px;
          right: 16px;
          top: 12px;
          flex-direction: column;
          gap: 6px;
        }

        .status {
          text-align: left;
          font-size: 12px;
        }

        .layout {
          margin-top: 150px;
        }

        .play-card {
          padding: 18px;
          border-radius: 12px;
        }

        .field,
        .server,
        .launch {
          height: 54px;
          font-size: 24px;
        }

        .bottom-stats {
          position: static;
          margin-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="menu-scene">
      <header class="hud-top">
        <section class="brand">
          <h1>ZOMBS.IO</h1>
          <p>Build. Defend. Survive.</p>
        </section>
        <aside class="status">
          US-EAST // tick 60 // ping 42ms // infected sectors: 3
        </aside>
      </header>

      <section class="layout">
        <nav class="side-menu" aria-label="Main menu actions">
          <button data-view="play" aria-current="true">PLAY</button>
          <button data-view="loadout">LOADOUT</button>
          <button data-view="settings">SETTINGS</button>
          <button data-view="account">ACCOUNT</button>
        </nav>

        <section class="play-card" aria-label="Server join card">
          <div class="card-top">
            <h2 id="menu-title">OUTBREAK SECTOR</h2>
            <span class="danger-pill">Night +1 incoming</span>
          </div>

          <div class="metrics">
            <span>Survivors: 284</span>
            <span>Alive: 152</span>
            <span>Queue: 3</span>
          </div>

          <div class="account-gate" id="account-gate">
            <span id="account-gate-text">Account required to deploy.</span>
            <button class="account-btn" id="account-btn">Create Account</button>
          </div>

          <div class="play-grid">
            <input
              class="field"
              type="text"
              value="Player-071"
              aria-label="Player name"
            />

            <select class="server" aria-label="Server selector">
              <option>US East #1 [High]</option>
              <option>US Central #2 [Medium]</option>
              <option>EU West #4 [Low]</option>
            </select>

            <button class="launch">Deploy</button>
          </div>

          <label class="footer-row">
            <input type="checkbox" /> Disable particles
          </label>
        </section>
      </section>

      <footer class="bottom-stats" aria-label="Player progression">
        <div class="hp">250</div>
        <div>
          <div class="meta">Level 8</div>
          <div class="meta">Gold 1320</div>
          <div class="meta">Bonds 0</div>
        </div>
      </footer>
    </main>
    <script>
      (() => {
        const state = {
          mode: "play",
          title: "OUTBREAK SECTOR",
          started: false,
          hasAccount: false,
        };

        const titles = {
          play: "OUTBREAK SECTOR",
          loadout: "LOADOUT",
          settings: "SETTINGS",
          account: "ACCOUNT",
        };

        const titleEl = document.getElementById("menu-title");
        const sideButtons = Array.from(
          document.querySelectorAll(".side-menu button"),
        );
        const launchBtn = document.querySelector(".launch");
        const accountGate = document.getElementById("account-gate");
        const accountGateText = document.getElementById("account-gate-text");
        const accountBtn = document.getElementById("account-btn");

        const refreshGateUi = () => {
          if (!launchBtn || !accountGate || !accountGateText || !accountBtn) {
            return;
          }

          if (state.hasAccount) {
            accountGate.classList.add("ok");
            accountGateText.textContent = "Account verified. You can deploy.";
            accountBtn.textContent = "Account Ready";
            accountBtn.disabled = true;
            launchBtn.disabled = false;
          } else {
            accountGate.classList.remove("ok");
            accountGateText.textContent = "Account required to deploy.";
            accountBtn.textContent = "Create Account";
            accountBtn.disabled = false;
            launchBtn.disabled = false;
          }
        };

        const setMode = (mode) => {
          state.mode = mode;
          state.title = titles[mode];
          if (titleEl) {
            titleEl.textContent = state.title;
          }
          sideButtons.forEach((button) => {
            button.setAttribute(
              "aria-current",
              button.dataset.view === mode ? "true" : "false",
            );
          });
        };

        sideButtons.forEach((button) => {
          button.addEventListener("click", () => {
            if (!button.dataset.view) return;
            setMode(button.dataset.view);
          });
        });

        if (launchBtn) {
          launchBtn.addEventListener("click", () => {
            if (!state.hasAccount) {
              setMode("account");
              if (accountGateText) {
                accountGateText.textContent =
                  "Create an account first, then deploy.";
              }
              return;
            }
            state.started = true;
            launchBtn.textContent = "Connecting...";
            launchBtn.disabled = true;
            window.setTimeout(() => {
              launchBtn.textContent = "Deploy";
              launchBtn.disabled = false;
            }, 1200);
          });
        }

        if (accountBtn) {
          accountBtn.addEventListener("click", () => {
            state.hasAccount = true;
            setMode("play");
            refreshGateUi();
          });
        }

        refreshGateUi();

        window.render_game_to_text = () =>
          JSON.stringify({
            mode: "menu",
            menu: {
              selectedTab: state.mode,
              title: state.title,
              started: state.started,
              hasAccount: state.hasAccount,
            },
            coordinates: "UI-only menu, no world coordinates",
          });

        window.advanceTime = (_ms) => {};
      })();
    </script>
  </body>
</html>
