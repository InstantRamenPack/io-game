<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balance</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.35;
        color: #172026;
        background: #f4f6f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1800px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 720;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .tab {
        height: 34px;
        border: 1px solid #c9d1d8;
        border-radius: 6px;
        background: #ffffff;
        color: #40505d;
        font: inherit;
        font-size: 13px;
        padding: 0 10px;
        cursor: pointer;
      }

      .tab.active {
        border-color: #2b7fff;
        background: #e9f2ff;
        color: #164f9f;
      }

      input[type="search"],
      select {
        height: 36px;
        border: 1px solid #c9d1d8;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        font: inherit;
      }

      input[type="search"] {
        width: min(360px, 40vw);
        padding: 0 10px;
      }

      select {
        padding: 0 8px;
      }

      .status {
        min-width: 160px;
        color: #5a6670;
        font-size: 13px;
        text-align: right;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid #cfd6dc;
        border-radius: 8px;
        background: #ffffff;
      }

      table {
        width: 100%;
        min-width: 1480px;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid #e1e6ea;
        border-right: 1px solid #e1e6ea;
        padding: 7px 8px;
        text-align: left;
        white-space: nowrap;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #edf1f4;
        color: #40505d;
        font-size: 12px;
        font-weight: 700;
      }

      th[draggable="true"] {
        cursor: grab;
      }

      th:first-child,
      td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        background: #ffffff;
        box-shadow: 1px 0 0 #e1e6ea;
      }

      th:first-child {
        z-index: 3;
        background: #edf1f4;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td[contenteditable="true"] {
        min-width: 72px;
        background: #fffdf3;
        cursor: text;
      }

      td[contenteditable="true"]:focus {
        outline: 2px solid #2b7fff;
        outline-offset: -2px;
        background: #ffffff;
      }

      .list-actions button,
      .add-row button {
        border: 1px solid #c9d1d8;
        border-radius: 5px;
        background: #ffffff;
        color: #172026;
        font: inherit;
        font-size: 12px;
        padding: 3px 7px;
        cursor: pointer;
      }

      .add-row input {
        width: min(560px, 60vw);
        height: 30px;
        border: 1px solid #c9d1d8;
        border-radius: 5px;
        padding: 0 8px;
        font: inherit;
      }

      .rendering-panel {
        display: none;
        grid-template-columns: minmax(360px, 520px) minmax(520px, 1fr);
        gap: 16px;
        align-items: start;
      }

      .rendering-panel.active {
        display: grid;
      }

      .rendering-controls,
      .rendering-preview {
        border: 1px solid #cfd6dc;
        border-radius: 8px;
        background: #ffffff;
        padding: 14px;
      }

      .rendering-controls label {
        display: grid;
        gap: 5px;
        margin-bottom: 10px;
        color: #40505d;
        font-size: 12px;
        font-weight: 700;
      }

      .rendering-controls input,
      .rendering-controls select {
        width: 100%;
      }

      .rendering-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .rendering-preview canvas {
        width: 100%;
        max-width: 820px;
        height: auto;
        display: block;
        background: #101820;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Balance</h1>
        </div>
        <div class="controls">
          <input
            id="search"
            type="search"
            placeholder="Filter weapons or bullets"
          />
          <div id="tabs" class="tabs">
            <button class="tab active" data-tab="weapons">Weapons</button>
            <button class="tab" data-tab="ammo">Ammo</button>
            <button class="tab" data-tab="enemies">Enemies</button>
            <button class="tab" data-tab="waves">Waves</button>
            <button class="tab" data-tab="world">Worldgen</button>
            <button class="tab" data-tab="loot">Loot</button>
            <button class="tab" data-tab="item-rendering">
              Item rendering
            </button>
            <button class="tab" data-tab="config">Config</button>
            <button class="tab" data-tab="json">All JSON</button>
          </div>
          <div id="status" class="status">Loading...</div>
        </div>
      </header>
      <div id="rendering-panel" class="rendering-panel">
        <div class="rendering-controls">
          <label>
            Item
            <select id="rendering-item-select"></select>
          </label>
          <div id="rendering-fields" class="rendering-fields"></div>
        </div>
        <div class="rendering-preview">
          <div id="rendering-canvas"></div>
        </div>
      </div>
      <div id="table-wrap" class="table-wrap">
        <table>
          <thead>
            <tr id="header-row"></tr>
          </thead>
          <tbody id="balance-rows"></tbody>
        </table>
      </div>
    </main>

    <script type="module">
      import { createBalanceRenderingPreview } from "/balance-item-rendering-preview.js";

      const columns = [
        { kind: "field", key: "item.label" },
        { kind: "meta", key: "weaponTypeId", label: "Weapon Type" },
        { kind: "meta", key: "attackStyle", label: "Attack" },
        { kind: "field", key: "item.rarityTier" },
        { kind: "field", key: "item.hunkCost" },
        { kind: "field", key: "mag.hunkCost" },
        { kind: "field", key: "projectile.label" },
        { kind: "meta", key: "projectileTypeId", label: "Bullet Type" },
        { kind: "field", key: "weapon.cooldownTicks" },
        { kind: "field", key: "weapon.magSize" },
        { kind: "field", key: "weapon.reloadTicks" },
        { kind: "field", key: "weapon.spreadDeg" },
        { kind: "field", key: "weapon.specialProjectileCount" },
        { kind: "field", key: "weapon.specialArcDeg" },
        { kind: "field", key: "weapon.specialSelfKnockback" },
        { kind: "field", key: "weapon.range" },
        { kind: "field", key: "weapon.damage" },
        { kind: "field", key: "weapon.knockback" },
        { kind: "field", key: "weapon.sweepArcDeg" },
        { kind: "field", key: "weapon.jabWidth" },
        { kind: "field", key: "projectile.speed" },
        { kind: "field", key: "projectile.range" },
        { kind: "field", key: "projectile.damage" },
        { kind: "field", key: "projectile.maxHits" },
        { kind: "field", key: "projectile.hitboxWidth" },
        { kind: "field", key: "projectile.hitboxHeight" },
        { kind: "field", key: "projectile.splitProjectileCount" },
        { kind: "field", key: "projectile.splitArcDeg" },
        { kind: "derived", key: "dpsNoReload", label: "DPS No Reload" },
        { kind: "derived", key: "dpsWithReload", label: "DPS With Reload" },
      ];
      const enemyColumns = [
        { kind: "field", key: "enemy.label" },
        { kind: "meta", key: "enemyTypeId", label: "Enemy Type" },
        { kind: "field", key: "enemy.rarityTier" },
        { kind: "field", key: "enemy.spawnWeaponSelection" },
        { kind: "field", key: "enemy.spawnWeaponTypeIds" },
        { kind: "field", key: "procedural.forestCorner" },
        { kind: "field", key: "procedural.forestEdge" },
        { kind: "field", key: "procedural.village.civilian" },
        { kind: "field", key: "procedural.village.scavenger" },
        { kind: "field", key: "procedural.village.military" },
        { kind: "field", key: "procedural.village.extraction_fortified" },
        { kind: "field", key: "waves.enabled" },
      ];
      const ammoColumns = [
        { kind: "field", key: "mag.label" },
        { kind: "meta", key: "magTypeId", label: "Ammo Type" },
        { kind: "field", key: "mag.hunkCost" },
      ];
      const worldColumns = [
        { kind: "meta", key: "configLabel", label: "Section" },
        { kind: "meta", key: "configId", label: "Config" },
        { kind: "field", key: "world.seed" },
        { kind: "field", key: "world.targetVillageCount" },
        { kind: "field", key: "world.lobbyWorldWidth" },
        { kind: "field", key: "world.lobbyWorldHeight" },
        { kind: "field", key: "world.weaponMaxActive" },
        { kind: "field", key: "world.blueprintMaxActive" },
        { kind: "field", key: "world.medicalMaxActive" },
        { kind: "field", key: "world.spawnAttempts" },
        { kind: "field", key: "world.randomEnabled" },
        { kind: "field", key: "world.baseBudget" },
        { kind: "field", key: "world.budgetPerNight" },
        { kind: "field", key: "world.targetPriority" },
        { kind: "field", key: "world.enemyDangerRadius" },
        { kind: "field", key: "world.boardTimerGoalMs" },
        { kind: "field", key: "world.chopperTimerGoalMs" },
        { kind: "field", key: "world.crateChance" },
        { kind: "field", key: "world.enemyChance" },
        { kind: "field", key: "world.furnitureChance" },
      ];
      const listColumns = [
        { kind: "meta", key: "label", label: "Domain List" },
        { kind: "meta", key: "file", label: "File" },
        { kind: "list", key: "entries", label: "Entries" },
      ];
      const jsonColumns = [
        { kind: "meta", key: "file", label: "File" },
        { kind: "meta", key: "pathLabel", label: "Path" },
        { kind: "field", key: "json.value" },
      ];

      const headerRow = document.querySelector("#header-row");
      const rowsBody = document.querySelector("#balance-rows");
      const searchInput = document.querySelector("#search");
      const tabButtons = [...document.querySelectorAll(".tab")];
      const statusElement = document.querySelector("#status");
      const tableWrap = document.querySelector("#table-wrap");
      const renderingPanel = document.querySelector("#rendering-panel");
      const renderingItemSelect = document.querySelector(
        "#rendering-item-select",
      );
      const renderingFields = document.querySelector("#rendering-fields");
      const renderingCanvas = document.querySelector("#rendering-canvas");

      let rows = [];
      let ammoRows = [];
      let renderingRows = [];
      let enemyRows = [];
      let worldRows = [];
      let listRows = [];
      let jsonRows = [];
      let rarityTiers = [];
      let fieldLabels = new Map();
      let activeTab = "weapons";
      let sortState = { key: "item.label", direction: "asc" };
      let draggedColumnKey = null;
      let selectedRenderingItemTypeId = null;
      let renderingPreview = null;
      let renderingPreviewReady = null;
      const renderingSaveTimers = new Map();

      function setStatus(message) {
        statusElement.textContent = message;
      }

      function renderHeader() {
        const activeColumns = columnsForCurrentMode();
        const headers = activeColumns.map((column) => {
          const th = document.createElement("th");
          th.draggable = activeTab === "weapons";
          th.dataset.columnKey = column.key;

          const label = document.createElement("span");
          label.className = "column-label";
          label.textContent = columnLabel(column);

          const sortMark = document.createElement("span");
          sortMark.className = "sort-mark";
          sortMark.textContent =
            sortState.key === column.key
              ? sortState.direction === "asc"
                ? "up"
                : "down"
              : "";
          label.append(sortMark);
          th.append(label);

          th.addEventListener("click", () => sortByColumn(column.key));
          th.addEventListener("dragstart", (event) => {
            draggedColumnKey = column.key;
            event.dataTransfer.effectAllowed = "move";
          });
          th.addEventListener("dragover", (event) => {
            event.preventDefault();
            th.classList.add("drag-over");
          });
          th.addEventListener("dragleave", () => {
            th.classList.remove("drag-over");
          });
          th.addEventListener("drop", (event) => {
            event.preventDefault();
            th.classList.remove("drag-over");
            moveColumn(draggedColumnKey, column.key);
          });
          th.addEventListener("dragend", () => {
            draggedColumnKey = null;
          });

          return th;
        });
        headerRow.replaceChildren(...headers);
      }

      function fieldByKey(row, key) {
        return row.fields.find((field) => field.key === key);
      }

      function columnLabel(column) {
        return column.kind === "field"
          ? (fieldLabels.get(column.key) ?? column.key)
          : column.label;
      }

      function sortByColumn(key) {
        sortState =
          sortState.key === key
            ? {
                key,
                direction: sortState.direction === "asc" ? "desc" : "asc",
              }
            : { key, direction: "asc" };
        renderHeader();
        renderRows();
      }

      function moveColumn(fromKey, toKey) {
        if (activeTab !== "weapons") {
          return;
        }
        if (!fromKey || fromKey === toKey) {
          return;
        }

        const fromIndex = columns.findIndex((column) => column.key === fromKey);
        const toIndex = columns.findIndex((column) => column.key === toKey);
        if (fromIndex < 0 || toIndex < 0) {
          return;
        }

        const [column] = columns.splice(fromIndex, 1);
        columns.splice(toIndex, 0, column);
        renderHeader();
        renderRows();
      }

      function columnValue(row, column) {
        if (column.kind === "field") {
          return fieldByKey(row, column.key)?.value ?? null;
        }
        return row[column.key] ?? null;
      }

      function compareValues(a, b) {
        if (a === b) {
          return 0;
        }
        if (a === null || a === undefined) {
          return 1;
        }
        if (b === null || b === undefined) {
          return -1;
        }
        if (typeof a === "number" && typeof b === "number") {
          return a - b;
        }
        return String(a).localeCompare(String(b), undefined, {
          numeric: true,
          sensitivity: "base",
        });
      }

      function matchesFilters(row) {
        const query = searchInput.value.trim().toLowerCase();
        const style = activeTab;
        if (style === "waves" || style === "loot") {
          if (!query) {
            return true;
          }
          return [
            row.label,
            row.file,
            ...row.entries.flatMap((entry) => [entry.label, entry.detail]),
          ]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
        }
        if (style === "world" || style === "config") {
          if (!query) {
            return true;
          }
          return [
            row.configLabel,
            row.configId,
            ...row.fields.map((field) => field.value),
          ]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
        }
        if (style === "json") {
          if (!query) {
            return true;
          }
          return [
            row.file,
            row.pathLabel,
            ...row.fields.map((field) => field.value),
          ]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
        }
        if (style === "enemies") {
          if (!query) {
            return true;
          }
          return [
            row.enemyLabel,
            row.enemyTypeId,
            fieldByKey(row, "enemy.label")?.value,
            fieldByKey(row, "enemy.spawnWeaponTypeIds")?.value,
          ]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
        }
        if (style === "ammo") {
          if (!query) {
            return true;
          }
          return [
            row.magLabel,
            row.magTypeId,
            fieldByKey(row, "mag.label")?.value,
          ]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
        }
        if (style === "weapons") {
          if (!query) {
            return true;
          }
        }
        if (!query) {
          return true;
        }

        return [
          row.weaponLabel,
          row.weaponTypeId,
          fieldByKey(row, "item.label")?.value,
          fieldByKey(row, "projectile.label")?.value,
          row.projectileLabel,
          row.projectileTypeId,
        ]
          .filter(Boolean)
          .some((value) => String(value).toLowerCase().includes(query));
      }

      function makeFixedCell(value) {
        const td = document.createElement("td");
        td.className = value ? "meta" : "missing";
        td.textContent = value ?? "-";
        return td;
      }

      function formatDerivedValue(value) {
        return typeof value === "number" ? value.toFixed(2) : "-";
      }

      function makeDerivedCell(value) {
        const td = document.createElement("td");
        td.className = typeof value === "number" ? "meta" : "missing";
        td.textContent = formatDerivedValue(value);
        return td;
      }

      function makeEditableCell(row, field) {
        const td = document.createElement("td");
        if (!field || (field.value === null && !field.editableWhenMissing)) {
          td.className = "missing";
          td.textContent = "-";
          return td;
        }

        if (
          field.key === "item.rarityTier" ||
          field.key === "enemy.rarityTier"
        ) {
          return makeRarityCell(row, field);
        }
        if (field.key === "enemy.spawnWeaponSelection") {
          return makeOptionCell(row, field, ["rotating", "all"]);
        }
        if (
          field.key === "procedural.forestCorner" ||
          field.key === "procedural.forestEdge" ||
          field.key.startsWith("procedural.village.") ||
          field.key === "waves.enabled" ||
          field.key === "world.randomEnabled" ||
          (field.key === "json.value" &&
            (field.value === "true" || field.value === "false"))
        ) {
          return makeOptionCell(row, field, ["true", "false"]);
        }

        td.contentEditable = "true";
        td.inputMode = field.kind === "number" ? "decimal" : "text";
        td.textContent = field.value === null ? "" : String(field.value);
        td.dataset.originalValue =
          field.value === null ? "" : String(field.value);
        if (field.value === null) {
          td.className = "missing";
        }

        td.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            td.blur();
          }
          if (event.key === "Escape") {
            event.preventDefault();
            td.textContent = td.dataset.originalValue ?? "";
            td.blur();
          }
        });

        td.addEventListener("blur", () => {
          void saveEditableCell(row, field, td);
        });

        return td;
      }

      function makeColumnCell(row, column) {
        if (column.kind === "list") {
          return makeListCell(row);
        }
        if (column.kind === "field") {
          return makeEditableCell(row, fieldByKey(row, column.key));
        }
        if (column.kind === "derived") {
          return makeDerivedCell(row[column.key]);
        }
        return makeFixedCell(row[column.key]);
      }

      function makeListCell(row) {
        const td = document.createElement("td");
        td.className = "list-cell";
        const items = document.createElement("div");
        items.className = "list-items";

        row.entries.forEach((entry, index) => {
          const item = document.createElement("div");
          item.className = "list-item";
          const label = document.createElement("strong");
          label.textContent = entry.label;
          const detail = document.createElement("span");
          detail.textContent = entry.detail;
          const actions = document.createElement("div");
          actions.className = "list-actions";
          for (const [text, action, value] of [
            ["Up", "move", "up"],
            ["Down", "move", "down"],
            ["Remove", "remove", null],
          ]) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = text;
            button.addEventListener("click", () => {
              void saveListAction(row, action, index, value);
            });
            actions.append(button);
          }
          item.append(label, detail, actions);
          items.append(item);
        });

        const addRow = document.createElement("div");
        addRow.className = "add-row";
        const input = document.createElement("input");
        input.value = row.addTemplate;
        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.textContent = "Add";
        addButton.addEventListener("click", () => {
          let value;
          try {
            value = JSON.parse(input.value);
          } catch {
            td.className = "list-cell error";
            setStatus("Invalid JSON for list entry");
            return;
          }
          void saveListAction(row, "add", null, value);
        });
        addRow.append(input, addButton);
        td.append(items, addRow);
        return td;
      }

      function makeRarityCell(row, field) {
        return makeOptionCell(row, field, rarityTiers);
      }

      function makeOptionCell(row, field, options) {
        const td = document.createElement("td");
        const select = document.createElement("select");
        select.className = "cell-select";
        select.dataset.originalValue = String(field.value ?? "");

        for (const rarity of options) {
          const option = document.createElement("option");
          option.value = rarity;
          option.textContent = rarity;
          select.append(option);
        }

        select.value = String(field.value ?? "common");
        select.addEventListener("change", () => {
          void saveCellValue(row, field, td, select.value, select);
        });

        td.append(select);
        return td;
      }

      async function saveEditableCell(row, field, cell) {
        await saveCellValue(row, field, cell, cell.textContent.trim(), cell);
      }

      async function saveCellValue(
        row,
        field,
        cell,
        rawValue,
        originalElement,
      ) {
        if (rawValue === originalElement.dataset.originalValue) {
          return;
        }

        const value =
          field.kind === "number"
            ? rawValue.length === 0 && field.deleteOnBlank
              ? null
              : Number(rawValue)
            : rawValue.length > 0
              ? rawValue
              : null;

        if (
          field.kind === "number" &&
          value !== null &&
          !Number.isFinite(value)
        ) {
          cell.className = "error";
          setStatus("Invalid number");
          return;
        }

        setStatus("Saving...");
        cell.className = "";

        const response = await fetch("/api/balance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: field.source,
            path: field.path,
            value,
            itemTypeId: row.itemTypeId,
            weaponTypeId: row.weaponTypeId ?? row.enemyTypeId,
            enemyTypeId: row.enemyTypeId,
            magTypeId: row.magTypeId,
            configId: row.configId,
            jsonId: row.jsonId,
          }),
        });
        const payload = await response.json();
        if (!response.ok) {
          cell.className = "error";
          setStatus(payload.error ?? "Save failed");
          return;
        }

        rows = payload.rows;
        renderingRows = payload.renderingRows ?? [];
        ammoRows = payload.ammoRows ?? [];
        enemyRows = payload.enemyRows ?? [];
        worldRows = payload.worldRows ?? [];
        listRows = payload.listRows ?? [];
        jsonRows = payload.jsonRows ?? [];
        rarityTiers = payload.rarityTiers ?? [];
        refreshFieldLabels();
        originalElement.dataset.originalValue = rawValue;
        cell.className = "changed";
        setStatus("Saved");
        renderRows();
      }

      async function saveListAction(row, action, index, value) {
        setStatus("Saving...");
        const response = await fetch("/api/balance/list", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            listId: row.listId,
            action,
            index,
            value,
          }),
        });
        const payload = await response.json();
        if (!response.ok) {
          setStatus(payload.error ?? "Save failed");
          return;
        }
        rows = payload.rows;
        renderingRows = payload.renderingRows ?? [];
        ammoRows = payload.ammoRows ?? [];
        enemyRows = payload.enemyRows ?? [];
        worldRows = payload.worldRows ?? [];
        listRows = payload.listRows ?? [];
        jsonRows = payload.jsonRows ?? [];
        rarityTiers = payload.rarityTiers ?? [];
        refreshFieldLabels();
        setStatus("Saved");
        renderRows();
      }

      function selectedRenderingRow() {
        if (renderingRows.length === 0) {
          return null;
        }
        return (
          renderingRows.find(
            (row) => row.itemTypeId === selectedRenderingItemTypeId,
          ) ?? renderingRows[0]
        );
      }

      function renderingField(row, key) {
        return row.fields.find((field) => field.key === key);
      }

      function renderingFieldValue(row, key, fallback) {
        const value = renderingField(row, key)?.value;
        return value === null || value === undefined ? fallback : value;
      }

      function updateRenderingFieldLocal(row, field, value) {
        const target = renderingField(row, field.key);
        if (target) {
          target.value = value;
        }
        if (field.key === "itemLike.assetPath" && typeof value === "string") {
          row.assetPath = value;
        }
      }

      async function saveRenderingField(row, field, rawValue) {
        const value =
          field.kind === "number"
            ? rawValue.length === 0
              ? null
              : Number(rawValue)
            : rawValue.length > 0
              ? rawValue
              : null;
        if (
          field.kind === "number" &&
          value !== null &&
          !Number.isFinite(value)
        ) {
          setStatus("Invalid number");
          return;
        }
        updateRenderingFieldLocal(row, field, value);
        void refreshRenderingPreview();
        const timerKey = `${row.itemTypeId}:${field.key}`;
        clearTimeout(renderingSaveTimers.get(timerKey));
        renderingSaveTimers.set(
          timerKey,
          setTimeout(async () => {
            setStatus("Saving...");
            const response = await fetch("/api/balance", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                source: field.source,
                path: field.path,
                value,
                itemTypeId: row.itemTypeId,
              }),
            });
            const payload = await response.json();
            if (!response.ok) {
              setStatus(payload.error ?? "Save failed");
              return;
            }
            rows = payload.rows;
            renderingRows = payload.renderingRows ?? [];
            ammoRows = payload.ammoRows ?? [];
            enemyRows = payload.enemyRows ?? [];
            worldRows = payload.worldRows ?? [];
            listRows = payload.listRows ?? [];
            jsonRows = payload.jsonRows ?? [];
            rarityTiers = payload.rarityTiers ?? [];
            refreshFieldLabels();
            setStatus("Saved");
            void refreshRenderingPreview();
          }, 350),
        );
      }

      function renderRenderingPanel() {
        tableWrap.style.display = "none";
        renderingPanel.classList.add("active");
        if (renderingRows.length === 0) {
          renderingFields.textContent = "No item rendering rows";
          return;
        }
        if (
          !selectedRenderingItemTypeId ||
          !renderingRows.some(
            (row) => row.itemTypeId === selectedRenderingItemTypeId,
          )
        ) {
          selectedRenderingItemTypeId = renderingRows[0].itemTypeId;
        }
        renderingItemSelect.replaceChildren(
          ...renderingRows.map((row) => {
            const option = document.createElement("option");
            option.value = row.itemTypeId;
            option.textContent = `${row.itemLabel} (${row.itemTypeId})`;
            return option;
          }),
        );
        renderingItemSelect.value = selectedRenderingItemTypeId;

        const row = selectedRenderingRow();
        const editableFields = row.fields.filter(
          (field) =>
            field.key.startsWith("itemLike.") ||
            field.key.startsWith("projectile."),
        );
        renderingFields.replaceChildren(
          ...editableFields.map((field) => {
            const label = document.createElement("label");
            label.textContent = field.label;
            const input = document.createElement("input");
            input.type = field.kind === "number" ? "number" : "text";
            input.step = field.kind === "number" ? "0.1" : undefined;
            input.value = field.value === null ? "" : String(field.value);
            input.addEventListener("input", () => {
              void saveRenderingField(row, field, input.value.trim());
            });
            label.append(input);
            return label;
          }),
        );
        void refreshRenderingPreview();
      }

      async function ensureRenderingPreview() {
        if (renderingPreview) {
          return renderingPreview;
        }
        if (!renderingPreviewReady) {
          renderingPreviewReady =
            createBalanceRenderingPreview(renderingCanvas);
        }
        renderingPreview = await renderingPreviewReady;
        return renderingPreview;
      }

      async function refreshRenderingPreview() {
        const row = selectedRenderingRow();
        if (!row) {
          return;
        }
        const preview = await ensureRenderingPreview();
        await preview.update(row);
      }

      function renderRows() {
        if (activeTab === "item-rendering") {
          renderRenderingPanel();
          return;
        }
        tableWrap.style.display = "";
        renderingPanel.classList.remove("active");
        const activeRows =
          activeTab === "json"
            ? jsonRows
            : activeTab === "waves"
              ? listRows.filter((row) => row.tab === "waves")
              : activeTab === "loot"
                ? listRows.filter((row) => row.tab === "loot")
                : activeTab === "world" || activeTab === "config"
                  ? worldRows
                  : activeTab === "ammo"
                    ? ammoRows
                    : activeTab === "enemies"
                      ? enemyRows
                      : rows;
        const activeColumns = columnsForCurrentMode();
        if (!activeColumns.some((column) => column.key === sortState.key)) {
          sortState =
            activeTab === "enemies"
              ? { key: "enemy.label", direction: "asc" }
              : activeTab === "ammo"
                ? { key: "mag.label", direction: "asc" }
                : activeTab === "json"
                  ? { key: "file", direction: "asc" }
                  : activeTab === "waves" || activeTab === "loot"
                    ? { key: "label", direction: "asc" }
                    : activeTab === "world" || activeTab === "config"
                      ? { key: "configLabel", direction: "asc" }
                      : { key: "item.label", direction: "asc" };
          renderHeader();
        }
        const sortColumn = activeColumns.find(
          (column) => column.key === sortState.key,
        );
        const visibleRows = activeRows.filter(matchesFilters).sort((a, b) => {
          if (!sortColumn) {
            return 0;
          }
          const result = compareValues(
            columnValue(a, sortColumn),
            columnValue(b, sortColumn),
          );
          return sortState.direction === "asc" ? result : -result;
        });
        const renderedRows = visibleRows.map((row) => {
          const tr = document.createElement("tr");
          tr.replaceChildren(
            ...activeColumns.map((column) => makeColumnCell(row, column)),
          );
          return tr;
        });

        rowsBody.replaceChildren(...renderedRows);
        setStatus(
          activeTab === "json"
            ? `${visibleRows.length} of ${jsonRows.length} JSON fields`
            : activeTab === "waves"
              ? `${visibleRows.length} wave lists`
              : activeTab === "loot"
                ? `${visibleRows.length} loot lists`
                : activeTab === "world" || activeTab === "config"
                  ? `${visibleRows.length} of ${worldRows.length} config sections`
                  : activeTab === "ammo"
                    ? `${visibleRows.length} of ${ammoRows.length} ammo rows`
                    : activeTab === "enemies"
                      ? `${visibleRows.length} of ${enemyRows.length} enemies`
                      : `${visibleRows.length} of ${rows.length} weapons`,
        );
      }

      function columnsForCurrentMode() {
        if (activeTab === "item-rendering") {
          return [];
        }
        if (activeTab === "ammo") {
          return ammoColumns;
        }
        if (activeTab === "waves" || activeTab === "loot") {
          return listColumns;
        }
        if (activeTab === "world" || activeTab === "config") {
          return worldColumns;
        }
        if (activeTab === "json") {
          return jsonColumns;
        }
        return activeTab === "enemies" ? enemyColumns : columns;
      }

      function refreshFieldLabels() {
        fieldLabels = new Map();
        for (const row of [
          ...rows,
          ...renderingRows,
          ...ammoRows,
          ...enemyRows,
          ...worldRows,
          ...jsonRows,
        ]) {
          for (const field of row.fields) {
            fieldLabels.set(field.key, field.label);
          }
        }
      }

      async function loadRows() {
        const response = await fetch("/api/balance");
        const payload = await response.json();
        rows = payload.rows;
        renderingRows = payload.renderingRows ?? [];
        ammoRows = payload.ammoRows ?? [];
        enemyRows = payload.enemyRows ?? [];
        worldRows = payload.worldRows ?? [];
        listRows = payload.listRows ?? [];
        jsonRows = payload.jsonRows ?? [];
        rarityTiers = payload.rarityTiers ?? [];
        refreshFieldLabels();
        renderHeader();
        renderRows();
      }

      searchInput.addEventListener("input", renderRows);
      renderingItemSelect.addEventListener("change", () => {
        selectedRenderingItemTypeId = renderingItemSelect.value;
        renderRenderingPanel();
      });
      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = button.dataset.tab;
          for (const tabButton of tabButtons) {
            tabButton.classList.toggle("active", tabButton === button);
          }
          renderHeader();
          renderRows();
        });
      });

      await loadRows();
    </script>
  </body>
</html>
